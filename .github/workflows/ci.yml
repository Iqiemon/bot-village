name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: village
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: village/go.mod
          cache: false
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
